name: Ultimate Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Create Clean Android Structure
        run: |
          mkdir -p app/src/main/java/com/battery/buddies
          mkdir -p app/src/main/res/layout
          
          # كتابة ملف build.gradle مستقر ومتوافق مع السيرفر
          cat << 'EOF' > build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.2.2' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF

          # كتابة إعدادات المشروع
          echo "include ':app'" > settings.gradle

          # كتابة ملف build.gradle الخاص بالـ app
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.battery.buddies'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.battery.buddies'
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
          }
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Force Build APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: battery-buddies-apk
          path: app/build/outputs/apk/debug/app-debug.apk
